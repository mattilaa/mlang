[package]
name = "mlnix"
version = "0.3.0"
entry = "src/main.mla"

[dependencies]

[c-dependencies]

[tool.mlang]
min_mlang_version = "0.2.12"
target_arch = "aarch64"
log_dir = "/tmp/mlang-mlnix"
stdout_log = "pkg.stdout.log"
stderr_log = "pkg.stderr.log"
warn_log = "pkg.warn.log"
path_entries = [
  "/opt/homebrew/opt/llvm/bin",
  "/usr/local/opt/llvm/bin",
  "/opt/homebrew/bin",
  "/usr/local/bin"
]

[tool.mlang.options]
userspace = "busybox"
busybox_arch = "aarch64"

[[task]]
name = "toolchain-check"
print = "[mlnix] Checking mlang, llc, objcopy, cross gcc, and QEMU"
workdir = "{{root}}"
commands = [
  [
    "sh",
    "-c",
    "if [ ! -x ../../build/mlang ]; then echo Missing ../../build/mlang. Build the compiler from the repository root first.; exit 1; fi"
  ],
  [
    "sh",
    "-c",
    "for tool in llc llvm-objcopy aarch64-none-elf-gcc aarch64-none-elf-objcopy aarch64-linux-musl-gcc qemu-system-aarch64 curl tar make gsed gzip od; do if ! command -v $tool >/dev/null 2>&1; then echo Missing required tool in PATH: $tool; exit 1; fi; done"
  ]
]

[[task]]
name = "busybox-userspace-fetch"
print = "[mlnix] Fetching BusyBox source when userspace=busybox"
depends_on = ["toolchain-check"]
workdir = "{{root}}"
shell = [
  "set -eu",
  "mkdir -p {{build_dir}}",
  'if [ "{{option.userspace}}" != "busybox" ]; then',
  "  echo BusyBox download skipped because userspace={{option.userspace}}.",
  "  exit 0",
  "fi",
  "BUSYBOX_VERSION=1.37.0",
  "BUSYBOX_TARBALL=busybox-$BUSYBOX_VERSION.tar.bz2",
  "BUSYBOX_URL=https://busybox.net/downloads/$BUSYBOX_TARBALL",
  '[ -f {{build_dir}}/$BUSYBOX_TARBALL ] || curl -L --fail "$BUSYBOX_URL" -o {{build_dir}}/$BUSYBOX_TARBALL'
]

[[task]]
name = "busybox-userspace-build"
print = "[mlnix] Building a RAM-linked BusyBox binary for EL0"
depends_on = ["busybox-userspace-fetch"]
workdir = "{{root}}"
shell = [
  "set -eu",
  'if [ "{{option.userspace}}" != "busybox" ]; then',
  "  echo BusyBox build skipped because userspace={{option.userspace}}.",
  "  exit 0",
  "fi",
  'case "{{option.busybox_arch}}" in',
  "  aarch64|arm64)",
  "    BUSYBOX_CROSS=aarch64-linux-musl-",
  "    BUSYBOX_TEXT=0x40200000",
  "    ;;",
  "  *)",
  "    echo Unsupported BusyBox arch: {{option.busybox_arch}}",
  "    exit 1",
  "    ;;",
  "esac",
  "BUSYBOX_VERSION=1.37.0",
  "BUSYBOX_TARBALL=busybox-$BUSYBOX_VERSION.tar.bz2",
  "rm -rf {{build_dir}}/busybox-src {{build_dir}}/busybox-install",
  "mkdir -p {{build_dir}}/busybox-src {{build_dir}}/busybox-install",
  "tar -xjf {{build_dir}}/$BUSYBOX_TARBALL -C {{build_dir}}/busybox-src --strip-components=1",
  "cd {{build_dir}}/busybox-src",
  "PATH=/opt/homebrew/opt/gnu-sed/libexec/gnubin:$PATH",
  "export PATH",
  "make distclean defconfig CROSS_COMPILE=$BUSYBOX_CROSS",
  "yes '' | make oldconfig CROSS_COMPILE=$BUSYBOX_CROSS",
  "gsed -i 's/^# CONFIG_STATIC is not set$/CONFIG_STATIC=y/' .config",
  "gsed -i 's/^CONFIG_STATIC=n$/CONFIG_STATIC=y/' .config || true",
  "gsed -i 's/^CONFIG_PIE=y$/# CONFIG_PIE is not set/' .config || true",
  "gsed -i 's/^# CONFIG_ASH is not set$/CONFIG_ASH=y/' .config",
  "gsed -i 's/^# CONFIG_SH_IS_ASH is not set$/CONFIG_SH_IS_ASH=y/' .config",
  "gsed -i 's/^CONFIG_FEATURE_PREFER_APPLETS=.*/CONFIG_FEATURE_PREFER_APPLETS=y/' .config || true",
  "gsed -i 's/^CONFIG_SHA1_HWACCEL=y$/# CONFIG_SHA1_HWACCEL is not set/' .config || true",
  "gsed -i 's/^CONFIG_SHA256_HWACCEL=y$/# CONFIG_SHA256_HWACCEL is not set/' .config || true",
  'EXTRA_CFLAGS=-Os\ -fno-pie',
  'EXTRA_LDFLAGS=--static\ -Wl,-Ttext-segment=$BUSYBOX_TEXT\ -no-pie',
  "export EXTRA_CFLAGS EXTRA_LDFLAGS",
  "make -j4 busybox CROSS_COMPILE=$BUSYBOX_CROSS",
  "cp busybox {{build_dir}}/busybox"
]

[[task]]
name = "build-user-initramfs"
print = "[mlnix] Packing the BusyBox EL0 initramfs tar"
depends_on = ["busybox-userspace-build"]
workdir = "{{root}}"
shell = [
  "set -eu",
  "mkdir -p {{build_dir}}/obj",
  "rm -rf {{build_dir}}/user_initramfs",
  "mkdir -p {{build_dir}}/user_initramfs/bin {{build_dir}}/user_initramfs/sbin {{build_dir}}/user_initramfs/usr/bin {{build_dir}}/user_initramfs/usr/sbin {{build_dir}}/user_initramfs/lib {{build_dir}}/user_initramfs/usr/lib",
  "cp -R src/user/initramfs/. {{build_dir}}/user_initramfs",
  "sh scripts/install-busybox-applets.sh {{build_dir}}/busybox {{build_dir}}/busybox-src/include/applets.h {{build_dir}}/user_initramfs",
  "rm -f {{build_dir}}/user_initramfs.tar",
  "COPYFILE_DISABLE=1 tar --format=ustar -cf {{build_dir}}/user_initramfs.tar -C {{build_dir}}/user_initramfs .",
  "cd {{build_dir}}",
  "aarch64-none-elf-objcopy --input-target=binary --output-target=elf64-littleaarch64 --binary-architecture=aarch64 user_initramfs.tar obj/user_initramfs.o"
]

[[task]]
name = "build-kernel-llvm"
print = "[mlnix] Emitting LLVM IR from the MLang kernel"
depends_on = ["toolchain-check"]
workdir = "{{root}}"
commands = [
  [
    "mkdir",
    "-p",
    "{{build_dir}}/obj"
  ],
  [
    "../../build/mlang",
    "--target-arch",
    "aarch64",
    "-emit-llvm",
    "src/main.mla",
    "-o",
    "{{build_dir}}/mlnix.kernel.host.ll"
  ]
]

[[task]]
name = "retarget-kernel-obj"
print = "[mlnix] Retargeting kernel IR to aarch64-none-elf"
depends_on = ["build-kernel-llvm"]
workdir = "{{root}}"
commands = [
  [
    "sh",
    "-c",
    "sed -e 's/target triple = \".*\"/target triple = \"aarch64-none-elf\"/' -e 's/e-m:o/e-m:e/' {{build_dir}}/mlnix.kernel.host.ll > {{build_dir}}/mlnix.kernel.elf.ll"
  ],
  [
    "llc",
    "-mtriple=aarch64-none-elf",
    "-filetype=obj",
    "{{build_dir}}/mlnix.kernel.elf.ll",
    "-o",
    "{{build_dir}}/obj/mlnix_kernel.o"
  ]
]

[[task]]
name = "build-runtime-shim"
print = "[mlnix] Compiling freestanding runtime shims"
depends_on = ["toolchain-check"]
workdir = "{{root}}"
commands = [
  [
    "mkdir",
    "-p",
    "{{build_dir}}/obj"
  ],
  [
    "aarch64-none-elf-gcc",
    "-ffreestanding",
    "-Wall",
    "-Wextra",
    "-c",
    "src/runtime/runtime.c",
    "-o",
    "{{build_dir}}/obj/runtime.o"
  ]
]

[[task]]
name = "build-entry"
print = "[mlnix] Assembling the boot entry shim"
depends_on = ["toolchain-check"]
workdir = "{{root}}"
commands = [
  [
    "mkdir",
    "-p",
    "{{build_dir}}/obj"
  ],
  [
    "aarch64-none-elf-gcc",
    "-c",
    "src/boot/entry.S",
    "-o",
    "{{build_dir}}/obj/entry.o"
  ]
]

[[task]]
name = "link-elf"
print = "[mlnix] Linking the freestanding kernel ELF"
depends_on = ["retarget-kernel-obj", "build-runtime-shim", "build-entry", "build-user-initramfs"]
workdir = "{{root}}"
commands = [
  [
    "aarch64-none-elf-gcc",
    "-nostdlib",
    "-T",
    "linker.ld",
    "-Wl,-Map,{{build_dir}}/mlnix.map",
    "{{build_dir}}/obj/entry.o",
    "{{build_dir}}/obj/mlnix_kernel.o",
    "{{build_dir}}/obj/runtime.o",
    "{{build_dir}}/obj/user_initramfs.o",
    "-o",
    "{{build_dir}}/mlnix.elf"
  ]
]

[[task]]
name = "build-image"
print = "[mlnix] Extracting a flat kernel image"
depends_on = ["link-elf"]
workdir = "{{root}}"
commands = [
  [
    "llvm-objcopy",
    "-O",
    "binary",
    "{{build_dir}}/mlnix.elf",
    "{{build_dir}}/mlnix.bin"
  ]
]

[[task]]
name = "qemu-run"
print = "[mlnix] Booting MLNIX under QEMU with {{option.userspace}} userspace"
join_on = ["build-image"]
workdir = "{{root}}"
command = [
  "qemu-system-aarch64",
  "-machine",
  "virt",
  "-cpu",
  "cortex-a57",
  "-m",
  "256",
  "-nographic",
  "-serial",
  "mon:stdio",
  "-monitor",
  "none",
  "-device",
  "loader,file={{build_dir}}/mlnix.bin,addr=0x4e000000,cpu-num=0,force-raw=on"
]
