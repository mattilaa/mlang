[package]
name = "mlnix"
version = "0.3.0"
entry = "src/main.mla"

[dependencies]

[c-dependencies]

[tool.mlang]
min_mlang_version = "0.2.12"
target_arch = "aarch64"
log_dir = "/tmp/mlang-mlnix"
stdout_log = "pkg.stdout.log"
stderr_log = "pkg.stderr.log"
warn_log = "pkg.warn.log"
path_entries = [
  "/opt/homebrew/opt/llvm/bin",
  "/usr/local/opt/llvm/bin",
  "/opt/homebrew/bin",
  "/usr/local/bin"
]

[tool.mlang.options]
userspace = "gnu"
gnu_rootfs_arch = "aarch64"

[[task]]
name = "toolchain-check"
print = "[mlnix] Checking mlang, llc, objcopy, cross gcc, and QEMU"
workdir = "{{root}}"
commands = [
  [
    "sh",
    "-c",
    "if [ ! -x ../../build/mlang ]; then echo Missing ../../build/mlang. Build the compiler from the repository root first.; exit 1; fi"
  ],
  [
    "sh",
    "-c",
    "for tool in llc llvm-objcopy aarch64-none-elf-gcc aarch64-none-elf-objcopy qemu-system-aarch64 curl tar; do if ! command -v $tool >/dev/null 2>&1; then echo Missing required tool in PATH: $tool; exit 1; fi; done"
  ]
]

[[task]]
name = "gnu-userspace-fetch"
print = "[mlnix] Fetching GNU rootfs when userspace=gnu"
depends_on = ["toolchain-check"]
workdir = "{{root}}"
shell = [
  "set -eu",
  "mkdir -p {{build_dir}}",
  'if [ "{{option.userspace}}" != "gnu" ]; then',
  "  echo GNU rootfs download skipped because userspace={{option.userspace}}.",
  "  exit 0",
  "fi",
  'case "{{option.gnu_rootfs_arch}}" in',
  "  aarch64|arm64)",
  "    ROOTFS_FILE=ubuntu-base-24.04.3-base-arm64.tar.gz",
  "    ROOTFS_URL=https://cdimage.ubuntu.com/ubuntu-base/releases/noble/release/ubuntu-base-24.04.3-base-arm64.tar.gz",
  "    ;;",
  "  x64|x86_64|amd64)",
  "    ROOTFS_FILE=ubuntu-base-24.04.3-base-amd64.tar.gz",
  "    ROOTFS_URL=https://cdimage.ubuntu.com/ubuntu-base/releases/noble/release/ubuntu-base-24.04.3-base-amd64.tar.gz",
  "    ;;",
  "  *)",
  "    echo Unsupported GNU rootfs arch: {{option.gnu_rootfs_arch}}",
  "    exit 1",
  "    ;;",
  "esac",
  '[ -f {{build_dir}}/$ROOTFS_FILE ] || curl -L --fail "$ROOTFS_URL" -o {{build_dir}}/$ROOTFS_FILE',
  "rm -rf {{build_dir}}/gnu-rootfs",
  "mkdir -p {{build_dir}}/gnu-rootfs",
  "tar -xzf {{build_dir}}/$ROOTFS_FILE -C {{build_dir}}/gnu-rootfs"
]

[[task]]
name = "build-user-hello"
print = "[mlnix] Compiling the static EL0 hello ELF"
depends_on = ["toolchain-check"]
workdir = "{{root}}"
commands = [
  [
    "mkdir",
    "-p",
    "{{build_dir}}/obj"
  ],
  [
    "aarch64-none-elf-gcc",
    "-static",
    "-nostdlib",
    "-nostartfiles",
    "-ffreestanding",
    "-fno-builtin",
    "-fno-stack-protector",
    "-mgeneral-regs-only",
    "-Wall",
    "-Wextra",
    "-O1",
    "-T",
    "src/user/user.ld",
    "src/user/hello.c",
    "-o",
    "{{build_dir}}/user_hello.elf"
  ]
]

[[task]]
name = "build-user-hello-obj"
print = "[mlnix] Wrapping the user ELF as a linkable blob"
depends_on = ["build-user-hello"]
workdir = "{{root}}"
shell = [
  "set -eu",
  "mkdir -p {{build_dir}}/obj",
  "cd {{build_dir}}",
  "aarch64-none-elf-objcopy --input-target=binary --output-target=elf64-littleaarch64 --binary-architecture=aarch64 user_hello.elf obj/user_hello.o"
]

[[task]]
name = "build-rootfs-archive"
print = "[mlnix] Packing the selected userspace into an embedded rootfs tar archive"
depends_on = ["gnu-userspace-fetch"]
workdir = "{{root}}"
shell = [
  "set -eu",
  "rm -f {{build_dir}}/gnu-rootfs.tar",
  'if [ "{{option.userspace}}" = "gnu" ]; then',
  "  COPYFILE_DISABLE=1 tar --format=ustar -cf {{build_dir}}/gnu-rootfs.tar -C {{build_dir}}/gnu-rootfs .",
  "else",
  "  dd if=/dev/zero of={{build_dir}}/gnu-rootfs.tar bs=512 count=2 status=none",
  "fi"
]

[[task]]
name = "build-rootfs-obj"
print = "[mlnix] Converting the mounted rootfs tar archive into a linkable object"
depends_on = ["build-rootfs-archive"]
workdir = "{{root}}"
shell = [
  "set -eu",
  "mkdir -p {{build_dir}}/obj",
  "cd {{build_dir}}",
  "aarch64-none-elf-objcopy --input-target=binary --output-target=elf64-littleaarch64 --binary-architecture=aarch64 gnu-rootfs.tar obj/gnu_rootfs.o"
]

[[task]]
name = "build-kernel-llvm"
print = "[mlnix] Emitting LLVM IR from the MLang kernel"
depends_on = ["toolchain-check"]
workdir = "{{root}}"
commands = [
  [
    "mkdir",
    "-p",
    "{{build_dir}}/obj"
  ],
  [
    "../../build/mlang",
    "--target-arch",
    "aarch64",
    "-emit-llvm",
    "src/main.mla",
    "-o",
    "{{build_dir}}/mlnix.kernel.host.ll"
  ]
]

[[task]]
name = "retarget-kernel-obj"
print = "[mlnix] Retargeting kernel IR to aarch64-none-elf"
depends_on = ["build-kernel-llvm"]
workdir = "{{root}}"
commands = [
  [
    "sh",
    "-c",
    "sed -e 's/target triple = \".*\"/target triple = \"aarch64-none-elf\"/' -e 's/e-m:o/e-m:e/' {{build_dir}}/mlnix.kernel.host.ll > {{build_dir}}/mlnix.kernel.elf.ll"
  ],
  [
    "llc",
    "-mtriple=aarch64-none-elf",
    "-filetype=obj",
    "{{build_dir}}/mlnix.kernel.elf.ll",
    "-o",
    "{{build_dir}}/obj/mlnix_kernel.o"
  ]
]

[[task]]
name = "build-runtime-shim"
print = "[mlnix] Compiling freestanding runtime shims"
depends_on = ["toolchain-check"]
workdir = "{{root}}"
commands = [
  [
    "mkdir",
    "-p",
    "{{build_dir}}/obj"
  ],
  [
    "aarch64-none-elf-gcc",
    "-ffreestanding",
    "-Wall",
    "-Wextra",
    "-c",
    "src/runtime/runtime.c",
    "-o",
    "{{build_dir}}/obj/runtime.o"
  ]
]

[[task]]
name = "build-entry"
print = "[mlnix] Assembling the boot entry shim"
depends_on = ["toolchain-check"]
workdir = "{{root}}"
commands = [
  [
    "mkdir",
    "-p",
    "{{build_dir}}/obj"
  ],
  [
    "aarch64-none-elf-gcc",
    "-c",
    "src/boot/entry.S",
    "-o",
    "{{build_dir}}/obj/entry.o"
  ]
]

[[task]]
name = "link-elf"
print = "[mlnix] Linking the freestanding kernel ELF"
depends_on = ["retarget-kernel-obj", "build-runtime-shim", "build-entry", "build-rootfs-obj", "build-user-hello-obj"]
workdir = "{{root}}"
commands = [
  [
    "aarch64-none-elf-gcc",
    "-nostdlib",
    "-T",
    "linker.ld",
    "-Wl,-Map,{{build_dir}}/mlnix.map",
    "{{build_dir}}/obj/entry.o",
    "{{build_dir}}/obj/mlnix_kernel.o",
    "{{build_dir}}/obj/runtime.o",
    "{{build_dir}}/obj/gnu_rootfs.o",
    "{{build_dir}}/obj/user_hello.o",
    "-o",
    "{{build_dir}}/mlnix.elf"
  ]
]

[[task]]
name = "build-image"
print = "[mlnix] Extracting a flat kernel image"
depends_on = ["link-elf"]
workdir = "{{root}}"
commands = [
  [
    "llvm-objcopy",
    "-O",
    "binary",
    "{{build_dir}}/mlnix.elf",
    "{{build_dir}}/mlnix.bin"
  ]
]

[[task]]
name = "qemu-run"
print = "[mlnix] Booting MLNIX under QEMU with {{option.userspace}} userspace"
join_on = ["build-image"]
workdir = "{{root}}"
command = [
  "qemu-system-aarch64",
  "-machine",
  "virt",
  "-cpu",
  "cortex-a57",
  "-m",
  "256",
  "-nographic",
  "-serial",
  "mon:stdio",
  "-monitor",
  "none",
  "-kernel",
  "{{build_dir}}/mlnix.bin"
]
