[package]
name = "coreaudio_filter_sweeps"
version = "0.1.0"

[tool.mlang]
min_mlang_version = "0.2.0"
build_dir = "build"
module_paths = ["../../modules"]

[tool.mlang.options]
audio_path = "../../examples/fft_example/illusion.wav"
audio_output = ""
filter = "lowpass24"
max_resonance_db = "12"
interpolation = "hermite"
playback_rate = "1"

[[task]]
name = "toolchain-check"
supported_hosts = ["darwin"]
unsupported_message = "This realtime filter example requires macOS CoreAudio"
commands = [
  "sh -c 'if [ ! -x ../../build/mlang ]; then echo Missing ../../build/mlang. Build the compiler first.; exit 1; fi'",
  "sh -c 'if ! command -v c++ >/dev/null 2>&1; then echo Missing required linker driver: c++; exit 1; fi'"
]

[[task]]
name = "prepare"
depends_on = ["toolchain-check"]
commands = ["mkdir -p {{build_dir}}/obj"]

[[task]]
name = "compile-filter"
phase = "compile"
depends_on = ["prepare"]
language = "mlang"
source = "src/filter_processor.mla"
output = "{{build_dir}}/obj/filter_processor.o"
compile_only = true
opt_level = "O2"

[[task]]
name = "compile-mlang-demo"
phase = "compile"
depends_on = ["compile-filter"]
language = "mlang"
source = "src/main_mlang.mla"
output = "{{build_dir}}/obj/main_mlang.o"
compile_only = true
opt_level = "O2"

[[task]]
name = "link-mlang-demo"
phase = "build"
depends_on = ["compile-mlang-demo"]
language = "c++"
output = "{{build_dir}}/coreaudio_filter_sweeps_mlang"
inputs = [
  "{{build_dir}}/obj/main_mlang.o",
  "{{build_dir}}/obj/filter_processor.o"
]
lib_paths = ["../../build"]
libs = ["mlang_std"]

[task.host.darwin]
linker_flags = [
  "-framework CoreAudio",
  "-framework AudioToolbox",
  "-framework CoreFoundation"
]

[task.host.linux]
libs = ["m", "dl"]

[[task]]
name = "demo"
depends_on = ["link-mlang-demo"]
log_output = false
shell = [
  "audio_output='{{option.audio_output}}'; set -- --filter '{{option.filter}}' --max-resonance-db '{{option.max_resonance_db}}' --interpolation '{{option.interpolation}}' --playback-rate '{{option.playback_rate}}' --audio-path '{{option.audio_path}}'; if [ -n \"$audio_output\" ]; then set -- \"$@\" --device \"$audio_output\"; fi; exec {{build_dir}}/coreaudio_filter_sweeps_mlang \"$@\""
]

[[task]]
name = "list-devices"
depends_on = ["link-mlang-demo"]
log_output = false
shell = [
  "exec {{build_dir}}/coreaudio_filter_sweeps_mlang --list-devices"
]

[[task]]
name = "list-devices-verbose"
depends_on = ["link-mlang-demo"]
log_output = false
shell = [
  "exec {{build_dir}}/coreaudio_filter_sweeps_mlang --list-devices"
]
