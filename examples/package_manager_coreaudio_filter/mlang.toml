[package]
name = "coreaudio_filter_sweeps"
version = "0.1.0"

[tool.mlang]
min_mlang_version = "0.2.0"
build_dir = "build"
module_paths = ["../../modules"]

[tool.mlang.options]
audio_path = "../../examples/fft_example/illusion.wav"
audio_output = ""
filter = "lowpass24"
max_resonance_db = "12"
interpolation = "hermite"
playback_rate = "1"

[[task]]
name = "toolchain-check"
supported_hosts = ["darwin"]
unsupported_message = "This realtime filter example requires macOS CoreAudio"
commands = [
  "sh -c 'if [ ! -x ../../build/mlang ]; then echo Missing ../../build/mlang. Build the compiler first.; exit 1; fi'",
  "sh -c 'for tool in cmake c++; do if ! command -v $tool >/dev/null 2>&1; then echo Missing required tool: $tool; exit 1; fi; done'"
]

[[task]]
name = "prepare"
depends_on = ["toolchain-check"]
commands = ["mkdir -p {{build_dir}}/obj {{build_dir}}/cmake"]

[[task]]
name = "compile-filter"
phase = "compile"
depends_on = ["prepare"]
language = "mlang"
source = "src/filter_processor.mla"
output = "{{build_dir}}/obj/filter_processor.o"
compile_only = true
opt_level = "O2"

[[task]]
name = "configure"
depends_on = ["compile-filter"]
commands = [
  "cmake -S {{root}} -B {{build_dir}}/cmake -DCMAKE_BUILD_TYPE=Release -DMLANG_FILTER_OBJECT={{build_dir}}/obj/filter_processor.o"
]

[[task]]
name = "build"
phase = "build"
depends_on = ["configure"]
commands = ["cmake --build {{build_dir}}/cmake --target coreaudio_filter_sweeps -j4"]

[[task]]
name = "demo"
depends_on = ["build"]
log_output = false
shell = [
  "audio_output='{{option.audio_output}}'; set -- --filter '{{option.filter}}' --max-resonance-db '{{option.max_resonance_db}}' --interpolation '{{option.interpolation}}' --playback-rate '{{option.playback_rate}}'; if [ -n \"$audio_output\" ]; then set -- \"$@\" --output-device \"$audio_output\"; fi; exec {{build_dir}}/cmake/coreaudio_filter_sweeps \"$@\" '{{option.audio_path}}'"
]

[[task]]
name = "list-devices"
depends_on = ["build"]
log_output = false
shell = [
  "exec {{build_dir}}/cmake/coreaudio_filter_sweeps --list-devices"
]

[[task]]
name = "list-devices-verbose"
depends_on = ["build"]
log_output = false
shell = [
  "exec {{build_dir}}/cmake/coreaudio_filter_sweeps --list-devices --verbose"
]
