[package]
name = "qemu_aarch64_bootloader"
version = "0.1.0"

[tool.mlang]
min_mlang_version = "0.2.0"
build_dir = "build"

[[task]]
name = "build"
print = "[example] Building the freestanding MLang AArch64 image"
commands = ["./build.sh"]

[[task]]
name = "demo"
print = "[example] Booting the MLang image under QEMU"
log_output = false
commands = ["./run.sh"]
