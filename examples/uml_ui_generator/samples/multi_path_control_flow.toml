[settings]
diagram = "activity"
title = "Multi-path release workflow"
title_size = 22
title_bold = true
scale = 1.0
box_radius = 8
edge_radius = 5

[properties]
action_fill = "#bfdbfe"
action_stroke = "#2563eb"
action_text = "#0f172a"
decision_fill = "#fde68a"
decision_stroke = "#d97706"
decision_text = "#111827"
start_fill = "#22c55e"
start_stroke = "#166534"
start_text = "#ffffff"
start_radius = 9
end_fill = "#c084fc"
end_stroke = "#7c3aed"
end_text = "#ffffff"
end_radius = 10
edge_color = "#334155"

[[nodes]]
id = "start"
type = "start"
label = ""

[[nodes]]
id = "draft"
type = "action"
label = "Draft change"

[[nodes]]
id = "review"
type = "decision"
label = "Review ok?"

[[nodes]]
id = "revise"
type = "action"
label = "Revise patch"
fill = "#fecaca"
stroke = "#dc2626"

[[nodes]]
id = "tests"
type = "action"
label = "Run tests"
fill = "#ddd6fe"
stroke = "#7c3aed"

[[nodes]]
id = "tests_ok"
type = "decision"
label = "Tests pass?"

[[nodes]]
id = "fix_tests"
type = "action"
label = "Fix failing tests"
fill = "#fecaca"
stroke = "#dc2626"

[[nodes]]
id = "deploy"
type = "decision"
label = "Deploy target?"
fill = "#fdba74"
stroke = "#ea580c"

[[nodes]]
id = "stage"
type = "action"
label = "Deploy to staging"
fill = "#bae6fd"
stroke = "#0284c7"
text = "#082f49"

[[nodes]]
id = "prod"
type = "action"
label = "Deploy to production"
fill = "#bbf7d0"
stroke = "#16a34a"
text = "#052e16"

[[nodes]]
id = "verify"
type = "decision"
label = "Smoke check ok?"

[[nodes]]
id = "rollback"
type = "action"
label = "Rollback release"
fill = "#fca5a5"
stroke = "#b91c1c"

[[nodes]]
id = "done"
type = "end"
label = ""

[[edges]]
from = "start"
to = "draft"

[[edges]]
from = "draft"
to = "review"

[[edges]]
from = "review"
to = "tests"
label = "yes"
color = "#16a34a"

[[edges]]
from = "review"
to = "revise"
label = "no"
color = "#dc2626"

[[edges]]
from = "revise"
to = "draft"
label = "retry"
color = "#2563eb"

[[edges]]
from = "tests"
to = "tests_ok"

[[edges]]
from = "tests_ok"
to = "deploy"
label = "yes"
color = "#16a34a"

[[edges]]
from = "tests_ok"
to = "fix_tests"
label = "no"
color = "#dc2626"

[[edges]]
from = "fix_tests"
to = "tests"
label = "rerun"
color = "#7c3aed"

[[edges]]
from = "deploy"
to = "stage"
label = "staging"
color = "#0284c7"

[[edges]]
from = "deploy"
to = "prod"
label = "production"
color = "#16a34a"

[[edges]]
from = "stage"
to = "verify"

[[edges]]
from = "prod"
to = "verify"

[[edges]]
from = "verify"
to = "done"
label = "yes"
color = "#16a34a"

[[edges]]
from = "verify"
to = "rollback"
label = "no"
color = "#dc2626"

[[edges]]
from = "rollback"
to = "stage"
label = "retry staging"
color = "#ea580c"
