[package]
name = "delay_audio_demo"
version = "0.1.0"

[tool.mlang]
min_mlang_version = "0.2.0"
build_dir = "build"
module_paths = ["../../modules"]

[tool.mlang.options]
audio_path = "../../examples/fft_example/illusion.wav"
audio_output = ""
mode = "pingpong"
delay_ms = "375"
delay_ramp_ms = "120"
bpm = "0"
delay_beats = "0.75"
jitter_ms = "0"
jitter_ramp_ms = "120"
feedback = "0.58"
reset_feedback = "0.68"
dry_wet = "0.60"
mix_ramp_ms = "80"
filter = "lowpass"
filter_scope = "delay"
filter_type_ramp_ms = "80"
filter_cutoff = "4200"
cutoff_ramp_ms = "80"
filter_resonance = "0.25"
resonance_ramp_ms = "80"
damping = "0.75"
damping_ramp_ms = "80"
tail_ms = "3000"
record_session = ""
replay_session = ""
output_file = ""

[[task]]
name = "toolchain-check"
commands = [
  "sh -c 'if [ ! -x ../../build/mlang ]; then echo Missing ../../build/mlang. Build the compiler first.; exit 1; fi'",
  "sh -c 'if ! command -v c++ >/dev/null 2>&1; then echo Missing required linker driver: c++; exit 1; fi'"
]

[[task]]
name = "prepare"
depends_on = ["toolchain-check"]
commands = ["mkdir -p {{build_dir}}/obj"]

[[task]]
name = "compile"
phase = "compile"
depends_on = ["prepare"]
language = "mlang"
source = "src/main.mla"
output = "{{build_dir}}/obj/main.o"
compile_only = true
opt_level = "O2"

[[task]]
name = "link"
phase = "build"
depends_on = ["compile"]
language = "c++"
output = "{{build_dir}}/delay_audio_demo"
inputs = ["{{build_dir}}/obj/main.o"]
lib_paths = ["../../build"]
libs = ["mlang_std"]

[task.host.darwin]
linker_flags = [
  "-framework CoreAudio",
  "-framework AudioToolbox",
  "-framework CoreFoundation"
]

[task.host.linux]
libs = ["m", "dl"]

[[task]]
name = "demo"
depends_on = ["link"]
log_output = false
shell = [
  "audio_output='{{option.audio_output}}'; record_session='{{option.record_session}}'; replay_session='{{option.replay_session}}'; output_file='{{option.output_file}}'; set -- --audio-path '{{option.audio_path}}' --mode '{{option.mode}}' --delay-ms '{{option.delay_ms}}' --delay-ramp-ms '{{option.delay_ramp_ms}}' --bpm '{{option.bpm}}' --delay-beats '{{option.delay_beats}}' --jitter-ms '{{option.jitter_ms}}' --jitter-ramp-ms '{{option.jitter_ramp_ms}}' --feedback '{{option.feedback}}' --reset-feedback '{{option.reset_feedback}}' --dry-wet '{{option.dry_wet}}' --mix-ramp-ms '{{option.mix_ramp_ms}}' --filter '{{option.filter}}' --filter-scope '{{option.filter_scope}}' --filter-type-ramp-ms '{{option.filter_type_ramp_ms}}' --filter-cutoff '{{option.filter_cutoff}}' --cutoff-ramp-ms '{{option.cutoff_ramp_ms}}' --filter-resonance '{{option.filter_resonance}}' --resonance-ramp-ms '{{option.resonance_ramp_ms}}' --damping '{{option.damping}}' --damping-ramp-ms '{{option.damping_ramp_ms}}' --tail-ms '{{option.tail_ms}}'; if [ -n \"$audio_output\" ]; then set -- \"$@\" --device \"$audio_output\"; fi; if [ -n \"$record_session\" ]; then set -- \"$@\" --record-session \"$record_session\"; fi; if [ -n \"$replay_session\" ]; then set -- \"$@\" --replay-session \"$replay_session\"; fi; if [ -n \"$output_file\" ]; then set -- \"$@\" --output-file \"$output_file\"; fi; exec {{build_dir}}/delay_audio_demo \"$@\""
]

[[task]]
name = "list-devices"
depends_on = ["link"]
log_output = false
shell = ["exec {{build_dir}}/delay_audio_demo --list-devices"]
