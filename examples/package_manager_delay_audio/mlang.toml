[package]
name = "delay_audio_demo"
version = "0.1.0"

[tool.mlang]
min_mlang_version = "0.2.0"
build_dir = "build"
module_paths = ["../../modules"]

[tool.mlang.options]
audio_path = "../../examples/fft_example/illusion.wav"
audio_output = ""
mode = "pingpong"
delay_ms = "375"
feedback = "0.58"
mix = "0.45"
filter = "lowpass"
filter_cutoff = "4200"
damping = "0.75"
tail_ms = "3000"

[[task]]
name = "toolchain-check"
commands = [
  "sh -c 'if [ ! -x ../../build/mlang ]; then echo Missing ../../build/mlang. Build the compiler first.; exit 1; fi'",
  "sh -c 'if ! command -v c++ >/dev/null 2>&1; then echo Missing required linker driver: c++; exit 1; fi'"
]

[[task]]
name = "prepare"
depends_on = ["toolchain-check"]
commands = ["mkdir -p {{build_dir}}/obj"]

[[task]]
name = "compile"
phase = "compile"
depends_on = ["prepare"]
language = "mlang"
source = "src/main.mla"
output = "{{build_dir}}/obj/main.o"
compile_only = true
opt_level = "O2"

[[task]]
name = "link"
phase = "build"
depends_on = ["compile"]
language = "c++"
output = "{{build_dir}}/delay_audio_demo"
inputs = ["{{build_dir}}/obj/main.o"]
lib_paths = ["../../build"]
libs = ["mlang_std"]

[task.host.darwin]
linker_flags = [
  "-framework CoreAudio",
  "-framework AudioToolbox",
  "-framework CoreFoundation"
]

[task.host.linux]
libs = ["m", "dl"]

[[task]]
name = "demo"
depends_on = ["link"]
log_output = false
shell = [
  "audio_output='{{option.audio_output}}'; set -- --audio-path '{{option.audio_path}}' --mode '{{option.mode}}' --delay-ms '{{option.delay_ms}}' --feedback '{{option.feedback}}' --mix '{{option.mix}}' --filter '{{option.filter}}' --filter-cutoff '{{option.filter_cutoff}}' --damping '{{option.damping}}' --tail-ms '{{option.tail_ms}}'; if [ -n \"$audio_output\" ]; then set -- \"$@\" --device \"$audio_output\"; fi; exec {{build_dir}}/delay_audio_demo \"$@\""
]

[[task]]
name = "list-devices"
depends_on = ["link"]
log_output = false
shell = ["exec {{build_dir}}/delay_audio_demo --list-devices"]
