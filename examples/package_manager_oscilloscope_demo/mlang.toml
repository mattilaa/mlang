[package]
name = "package_manager_oscilloscope_demo"
version = "0.2.11"
entry = "src/main.mla"

[dependencies]

[c-dependencies]

[tool.mlang]
min_mlang_version = "0.2.0"
build_dir = "build"
deps_dir = "build/deps"

[tool.mlang.options]
wav_path = "../fft_example/illusion.wav"

[[task]]
name = "toolchain-check"
print = "[example] Checking macOS, MLang, C++, and archiver toolchains"
supported_hosts = ["darwin"]
unsupported_message = "Only macOS CoreAudio is supported now"
workdir = "{{root}}"
commands = [
  "sh -c 'if [ ! -x ../../build/mlang ]; then echo Missing ../../build/mlang. Build the compiler from the repository root first.; exit 1; fi'",
  "sh -c 'for tool in c++ ar; do if ! command -v $tool >/dev/null 2>&1; then echo Missing required tool in PATH: $tool; exit 1; fi; done'"
]

[[task]]
name = "prepare-build-tree"
print = "[example] Preparing build output directories"
workdir = "{{root}}"
commands = [
  "mkdir -p {{build_dir}}/obj"
]

[[task]]
name = "compile-mlang-main"
phase = "compile"
print = "[example] Compiling the MLang oscilloscope frontend"
workdir = "{{root}}"
depends_on = ["toolchain-check", "prepare-build-tree"]
language = "mlang"
source = "src/main.mla"
output = "{{build_dir}}/obj/oscilloscope_main.o"
compile_only = true
opt_level = "O2"

[[task]]
name = "compile-cpp-bridge"
phase = "compile"
print = "[example] Compiling the CoreAudio bridge"
workdir = "{{root}}"
depends_on = ["toolchain-check", "prepare-build-tree"]
language = "c++"
source = "src/oscilloscope_bridge.cpp"
output = "{{build_dir}}/obj/oscilloscope_bridge.o"
compile_only = true
compiler_flags = [
  "-std=c++17",
  "-O2",
  "-I../../include"
]

[[task]]
name = "link-demo"
phase = "build"
print = "[example] Linking the oscilloscope demo"
workdir = "{{root}}"
depends_on = ["compile-mlang-main", "compile-cpp-bridge"]
language = "c++"
output = "{{build_dir}}/oscilloscope_demo"
inputs = [
  "{{build_dir}}/obj/oscilloscope_main.o",
  "{{build_dir}}/obj/oscilloscope_bridge.o"
]
lib_paths = ["../../build"]
libs = ["mlang_std"]

[task.host.darwin]
linker_flags = [
  "-framework AudioToolbox",
  "-framework CoreFoundation"
]

[[task]]
name = "demo"
print = "[example] Running the realtime oscilloscope demo"
workdir = "{{root}}"
depends_on = ["link-demo"]
log_output = false
shell = [
  "exec {{build_dir}}/oscilloscope_demo {{option.wav_path}}"
]
