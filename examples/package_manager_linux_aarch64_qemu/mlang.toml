[package]
name = "linux_aarch64_qemu"
version = "0.1.0"

[dependencies]
linux = { url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.1.tar.gz", archive = "tar.gz", strip_components = "1", build = "none" }

[c-dependencies]

[tool.mlang]
min_mlang_version = "0.2.0"
make_program = "gmake"
path_entries = [
  "/opt/homebrew/opt/make/libexec/gnubin",
  "/usr/local/opt/make/libexec/gnubin",
  "/opt/homebrew/opt/lld/bin",
  "/usr/local/opt/lld/bin",
  "/opt/homebrew/opt/llvm/bin",
  "/usr/local/opt/llvm/bin",
  "/opt/homebrew/bin",
  "/usr/local/bin"
]

[[task]]
name = "toolchain-check"
workdir = "{{root}}"
commands = [
  "sh -c 'if ! command -v {{make}} >/dev/null 2>&1; then echo Missing required tool in PATH: {{make}}; exit 1; fi'"
]

[task.host.darwin]
shell = [
  "if ! command -v docker >/dev/null 2>&1; then",
  "  echo \"Missing required tool in PATH: docker\"",
  "  echo \"On macOS install Docker Desktop or another Docker runtime.\"",
  "  exit 1",
  "fi",
  "if ! docker info >/dev/null 2>&1; then",
  "  echo \"Docker is installed but the daemon is not reachable.\"",
  "  echo \"Start Docker Desktop or your Docker runtime and retry.\"",
  "  exit 1",
  "fi"
]

[[task]]
name = "docker-image"
workdir = "{{root}}"
commands = [
  "sh -c 'echo docker image build is only used on darwin hosts'"
]

[task.host.darwin]
depends_on = ["toolchain-check"]
shell = [
  "docker build -t mlang-linux-kernel-aarch64-qemu:latest -f {{root}}/docker/kernel-build.Dockerfile {{root}}"
]

[[task]]
name = "kernel-defconfig"
workdir = "{{root}}"
commands = [
  "{{make}} -C {{deps_dir}}/linux ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE:-} defconfig"
]

[task.host.darwin]
depends_on = ["docker-image"]
shell = [
  "docker run --rm \\",
  "  -v {{root}}:/workspace \\",
  "  -w /workspace/build/deps/linux \\",
  "  -e HOME=/tmp/mlang-docker-home \\",
  "  -e CROSS_COMPILE=${CROSS_COMPILE:-aarch64-linux-gnu-} \\",
  "  mlang-linux-kernel-aarch64-qemu:latest \\",
  "  sh -lc 'make ARCH=arm64 defconfig'"
]

[[task]]
name = "kernel-build"
workdir = "{{root}}"
commands = [
  "{{make}} -C {{deps_dir}}/linux ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE:-} defconfig",
  "{{make}} -C {{deps_dir}}/linux ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE:-} -j${JOBS:-4} Image"
]

[task.host.darwin]
depends_on = ["docker-image"]
shell = [
  "docker run --rm \\",
  "  -v {{root}}:/workspace \\",
  "  -w /workspace/build/deps/linux \\",
  "  -e HOME=/tmp/mlang-docker-home \\",
  "  -e CROSS_COMPILE=${CROSS_COMPILE:-aarch64-linux-gnu-} \\",
  "  mlang-linux-kernel-aarch64-qemu:latest \\",
  "  sh -lc 'make ARCH=arm64 defconfig'",
  "docker run --rm \\",
  "  -v {{root}}:/workspace \\",
  "  -w /workspace/build/deps/linux \\",
  "  -e HOME=/tmp/mlang-docker-home \\",
  "  -e CROSS_COMPILE=${CROSS_COMPILE:-aarch64-linux-gnu-} \\",
  "  mlang-linux-kernel-aarch64-qemu:latest \\",
  "  sh -lc 'make ARCH=arm64 -j${JOBS:-4} Image'"
]

[[task]]
name = "initramfs"
workdir = "{{root}}"
commands = [
  "rm -rf {{build_dir}}/initramfs {{build_dir}}/initramfs.cpio.gz",
  "mkdir -p {{build_dir}}/initramfs",
  "cp -R {{root}}/rootfs/. {{build_dir}}/initramfs/",
  "chmod +x {{build_dir}}/initramfs/init",
  "sh -c 'cd {{build_dir}}/initramfs && find . -print | cpio -o -H newc | gzip -9 > {{build_dir}}/initramfs.cpio.gz'"
]

[[task]]
name = "qemu-run"
workdir = "{{root}}"
join_on = ["kernel-build", "initramfs"]
commands = [
  "qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 1024 -nographic -kernel {{deps_dir}}/linux/arch/arm64/boot/Image -initrd {{build_dir}}/initramfs.cpio.gz -append \"console=ttyAMA0 rdinit=/init\""
]

[[task]]
name = "boot-flow"
workdir = "{{root}}"
parallel = true
next = ["kernel-build", "initramfs", "qemu-run"]
commands = [
  "sh -c 'echo Starting Linux AArch64 build and QEMU boot flow'"
]
