[package]
name = "linux_aarch64_qemu" # Package name used by the example
version = "0.1.0"

[dependencies]
# Fetch the Linux kernel source as a tarball and let curl show its own progress.
linux = { url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.1.tar.gz", archive = "tar.gz", strip_components = "1", build = "none", spinner = false } # End-of-line comments are supported too

[c-dependencies]

[tool.mlang]
min_mlang_version = "0.2.0"
make_program = "gmake"
# Full-line TOML comments work anywhere outside quoted strings.
log_dir = "/tmp/mlang-linux-aarch64-qemu"
stdout_log = "pkg.stdout.log"
stderr_log = "pkg.stderr.log"
warn_log = "pkg.warn.log"

[tool.mlang.options]
# Select the guest userspace from the command line:
#   ../../build/mlang pkg run qemu-run --option userspace=busybox
#   ../../build/mlang pkg run qemu-run --option userspace=gnu
userspace = "busybox"

[tool.mlang]
path_entries = [
  "/opt/homebrew/opt/gnu-sed/libexec/gnubin", # Prefer GNU sed when available
  "/usr/local/opt/gnu-sed/libexec/gnubin",
  "/opt/homebrew/opt/make/libexec/gnubin",
  "/usr/local/opt/make/libexec/gnubin",
  "/opt/homebrew/opt/lld/bin",
  "/usr/local/opt/lld/bin",
  "/opt/homebrew/opt/llvm/bin",
  "/usr/local/opt/llvm/bin",
  "/opt/homebrew/bin",
  "/usr/local/bin"
]

[[task]]
name = "toolchain-check"
print = "[example] Checking required build tools in PATH"
workdir = "{{root}}"
commands = [
  [
    'sh',
    '-c',
    'if [ ! -x ../../build/mlang ]; then echo Missing ../../build/mlang. Build the compiler from the repository root first.; exit 1; fi'
  ],
]
commands += [
  [
    'sh',
    '-c',
    'if ! command -v {{make}} >/dev/null 2>&1; then echo Missing required tool in PATH: {{make}}; exit 1; fi'
  ],
]

[task.host.darwin]
shell = [
  "for tool in {{make}} clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-ranlib llvm-strip; do",
  "  if ! command -v $tool >/dev/null 2>&1; then",
  "    echo Missing required tool in PATH: $tool",
  "    echo On Apple Silicon macOS install: brew install llvm lld libelf gnu-sed make qemu cpio",
  "    exit 1",
  "  fi",
  "done",
  "if ! sed --version >/dev/null 2>&1; then",
  "  echo GNU sed is required. Ensure Homebrew gnu-sed is installed and ahead of /usr/bin in path_entries.",
  "  echo Install with: brew install gnu-sed",
  "  exit 1",
  "fi",
  "if [ ! -d /opt/homebrew/opt/libelf/include ] && [ ! -d /usr/local/opt/libelf/include ]; then",
  "  echo Homebrew libelf headers were not found under /opt/homebrew/opt/libelf or /usr/local/opt/libelf.",
  "  echo Install with: brew install libelf",
  "  exit 1",
  "fi",
  "if ! clang --version | grep -qi llvm; then",
  "  echo clang in PATH is not the Homebrew LLVM clang. Check path_entries ordering in mlang.toml.",
  "  exit 1",
  "fi"
]

[[task]]
name = "darwin-native-prepare"
print = "[example] Darwin host detected, preparing native Linux kernel host-build compatibility files"
workdir = "{{root}}"
commands = [
  "sh -c 'echo native Darwin patching is only used on macOS hosts'"
]

[task.host.darwin]
print = "[example] Generating Darwin compatibility headers and patching scripts/mod/file2alias.c"
depends_on = ["toolchain-check"]
shell = [
  "LINUX_DIR={{deps_dir}}/linux",
  "mkdir -p $LINUX_DIR/scripts/macos-include",
  "cat > $LINUX_DIR/scripts/macos-include/elf.h <<'EOF'",
  "#pragma once",
  "#include <libelf/gelf.h>",
  "#ifndef EM_ARM",
  "#define EM_ARM 40",
  "#endif",
  "#ifndef EM_AARCH64",
  "#define EM_AARCH64 183",
  "#endif",
  "#ifndef EM_XTENSA",
  "#define EM_XTENSA 94",
  "#endif",
  "#ifndef EM_RISCV",
  "#define EM_RISCV 243",
  "#endif",
  "#ifndef EM_LOONGARCH",
  "#define EM_LOONGARCH 258",
  "#endif",
  "#define STT_SPARC_REGISTER 3",
  "#define R_386_32 1",
  "#define R_386_PC32 2",
  "#define R_MIPS_HI16 5",
  "#define R_MIPS_LO16 6",
  "#define R_MIPS_26 4",
  "#define R_MIPS_32 2",
  "#define R_ARM_ABS32 2",
  "#define R_ARM_REL32 3",
  "#define R_ARM_PC24 1",
  "#define R_ARM_CALL 28",
  "#define R_ARM_JUMP24 29",
  "#define R_ARM_THM_JUMP24 30",
  "#define R_ARM_THM_PC22 10",
  "#define R_ARM_MOVW_ABS_NC 43",
  "#define R_ARM_MOVT_ABS 44",
  "#define R_ARM_THM_MOVW_ABS_NC 47",
  "#define R_ARM_THM_MOVT_ABS 48",
  "#define R_ARM_THM_JUMP19 51",
  "#define EF_ARM_EABI_MASK 0xFF000000",
  "#define EF_ARM_EABI_VERSION(flags) ((flags) & EF_ARM_EABI_MASK)",
  "#define EF_ARM_EABI_VER5 0x05000000",
  "#define EF_ARM_ABI_FLOAT_SOFT 0x200",
  "#define EF_ARM_ABI_FLOAT_HARD 0x400",
  "#define R_AARCH64_ABS64 257",
  "#define R_AARCH64_PREL64 260",
  "EOF",
  "cat > $LINUX_DIR/scripts/macos-include/byteswap.h <<'EOF'",
  "#pragma once",
  "#define bswap_16 __builtin_bswap16",
  "#define bswap_32 __builtin_bswap32",
  "#define bswap_64 __builtin_bswap64",
  "EOF",
  "cat > $LINUX_DIR/scripts/macos-include/endian.h <<'EOF'",
  "#pragma once",
  "#define __LITTLE_ENDIAN 1234",
  "#define __BIG_ENDIAN 4321",
  "#define __PDP_ENDIAN 3412",
  "#define LITTLE_ENDIAN __LITTLE_ENDIAN",
  "#define BIG_ENDIAN __BIG_ENDIAN",
  "#define PDP_ENDIAN __PDP_ENDIAN",
  "#define __BYTE_ORDER __BYTE_ORDER__",
  "#define BYTE_ORDER __BYTE_ORDER__",
  "#define __FLOAT_WORD_ORDER __BYTE_ORDER__",
  "#define FLOAT_WORD_ORDER __BYTE_ORDER__",
  "#if __BYTE_ORDER__ == __ORDER_LITTLE_ENDIAN__",
  "#define htobe16(x) __builtin_bswap16(x)",
  "#define htole16(x) (x)",
  "#define be16toh(x) __builtin_bswap16(x)",
  "#define le16toh(x) (x)",
  "#define htobe32(x) __builtin_bswap32(x)",
  "#define htole32(x) (x)",
  "#define be32toh(x) __builtin_bswap32(x)",
  "#define le32toh(x) (x)",
  "#define htobe64(x) __builtin_bswap64(x)",
  "#define htole64(x) (x)",
  "#define be64toh(x) __builtin_bswap64(x)",
  "#define le64toh(x) (x)",
  "#else",
  "#define htobe16(x) (x)",
  "#define htole16(x) __builtin_bswap16(x)",
  "#define be16toh(x) (x)",
  "#define le16toh(x) __builtin_bswap16(x)",
  "#define htobe32(x) (x)",
  "#define htole32(x) __builtin_bswap32(x)",
  "#define be32toh(x) (x)",
  "#define le32toh(x) __builtin_bswap32(x)",
  "#define htobe64(x) (x)",
  "#define htole64(x) __builtin_bswap64(x)",
  "#define be64toh(x) (x)",
  "#define le64toh(x) __builtin_bswap64(x)",
  "#endif",
  "EOF",
  "FILE=$LINUX_DIR/scripts/mod/file2alias.c",
  "python3 - <<'PY'",
  "from pathlib import Path",
  "path = Path(r'''{{deps_dir}}/linux/scripts/mod/file2alias.c''')",
  "text = path.read_text()",
  "marker = '#include \"devicetable-offsets.h\"'",
  "prefix, sep, rest = text.partition(marker)",
  "if not sep:",
  "    raise SystemExit('failed to locate devicetable-offsets include in file2alias.c')",
  "comment_end = prefix.find('*/')",
  "if comment_end == -1:",
  "    raise SystemExit('failed to locate leading comment in file2alias.c')",
  "comment_block = prefix[:comment_end + 2]",
  "fixed_prefix = [",
  "    comment_block,",
  "    '',",
  "    '#define _UUID_T',",
  "    '#define uuid_t int',",
  "    '#include \"modpost.h\"',",
  "    '#undef uuid_t',",
  "    '#include \"devicetable-offsets.h\"',",
  "    '',",
  "]",
  "text = chr(10).join(fixed_prefix) + rest",
  "path.write_text(text)",
  "PY"
]

[[task]]
name = "kernel-defconfig"
print = "[example] Generating Linux arm64 defconfig in {{deps_dir}}/linux"
workdir = "{{root}}"
commands = [
  "{{make}} -C {{deps_dir}}/linux ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE:-} defconfig"
]

[task.host.darwin]
print = "[example] Generating Linux arm64 defconfig with LLVM toolchain on Darwin"
depends_on = ["darwin-native-prepare"]
env = [
  "HOSTCFLAGS=-Iscripts/macos-include -I/opt/homebrew/opt/libelf/include -I/usr/local/opt/libelf/include -Wno-error=incompatible-pointer-types",
  "HOSTLDFLAGS=-L/opt/homebrew/opt/libelf/lib -L/usr/local/opt/libelf/lib",
  "HOSTLDLIBS=-lelf"
]
commands = [
  "{{make}} -C {{deps_dir}}/linux ARCH=arm64 LLVM=1 LLVM_IAS=1 defconfig"
]

[[task]]
name = "kernel-build"
phase = "build"
print = "[example] Building Linux arm64 kernel image into {{deps_dir}}/linux/arch/arm64/boot/Image"
inline_output = true
workdir = "{{root}}"
depends_on = ["toolchain-check"]
commands = [
  "{{make}} -C {{deps_dir}}/linux ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE:-} defconfig",
  "{{make}} -C {{deps_dir}}/linux ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE:-} -j${JOBS:-4} Image"
]

[task.host.darwin]
print = "[example] Building Linux arm64 kernel image with LLVM toolchain on Darwin"
depends_on = ["darwin-native-prepare"]
env = [
  "HOSTCFLAGS=-Iscripts/macos-include -I/opt/homebrew/opt/libelf/include -I/usr/local/opt/libelf/include -Wno-error=incompatible-pointer-types",
  "HOSTLDFLAGS=-L/opt/homebrew/opt/libelf/lib -L/usr/local/opt/libelf/lib",
  "HOSTLDLIBS=-lelf"
]
commands = [
  "{{make}} -C {{deps_dir}}/linux ARCH=arm64 LLVM=1 LLVM_IAS=1 defconfig",
  "{{make}} -C {{deps_dir}}/linux ARCH=arm64 LLVM=1 LLVM_IAS=1 -j${JOBS:-4} Image"
]

[[task]]
name = "initramfs"
print = "[example] Packing initramfs into {{build_dir}}/initramfs.cpio.gz"
workdir = "{{root}}"
depends_on = ["busybox-fetch", "gnu-userspace-fetch"]
shell = [
  "rm -rf {{build_dir}}/initramfs {{build_dir}}/initramfs.cpio.gz",
  "# In GNU mode, unpack the base rootfs first so distro-owned symlinks like /bin -> /usr/bin are preserved.",
  "if [ '{{option.userspace}}' = 'gnu' ]; then",
  "  mkdir -p {{build_dir}}/initramfs",
  "  cp -a {{build_dir}}/gnu-rootfs/. {{build_dir}}/initramfs/",
  "  # Use a wrapper script so BusyBox init gets one simple respawn command for the GNU shell.",
  "  CONSOLE_CMD='/bin/cttyhack /bin/start-gnu-shell'",
  "  mkdir -p {{build_dir}}/initramfs/root",
  "  # Give the GNU bash login shell a readable default color scheme for ls output on the QEMU serial console.",
  "  cat > {{build_dir}}/initramfs/root/.profile <<'EOF'",
  "export LS_COLORS='rs=0:di=01;34:ln=01;36:mh=00:pi=40;33:so=01;35:do=01;35:bd=40;33;01:cd=40;33;01:or=40;31;01:mi=00:su=37;41:sg=30;43:ca=30;41:tw=30;42:ow=34;42:st=37;44:ex=01;32'",
  "alias ls='ls --color=auto'",
  "alias ll='ls -alF --color=auto'",
  "alias la='ls -A --color=auto'",
  "EOF",
  "  cat > {{build_dir}}/initramfs/bin/start-gnu-shell <<'EOF'",
  "#!/bin/sh",
  "export HOME=/root",
  "export TERM=xterm-256color",
  "exec /bin/bash --login -i",
  "EOF",
  "  chmod +x {{build_dir}}/initramfs/bin/start-gnu-shell",
  "  echo 'GNU userspace selected: Ubuntu Base ARM64 with bash and a wider GNU-style toolset.' > {{build_dir}}/initramfs/etc/mlang-userspace.txt",
  "else",
  "  mkdir -p {{build_dir}}/initramfs/bin {{build_dir}}/initramfs/usr/bin",
  "  CONSOLE_CMD='/bin/cttyhack /bin/sh'",
  "  echo 'BusyBox userspace selected.' > {{build_dir}}/initramfs/etc/mlang-userspace.txt",
  "fi",
  "# Add the runtime directories that both userspaces need for boot.",
  "mkdir -p {{build_dir}}/initramfs/dev {{build_dir}}/initramfs/etc {{build_dir}}/initramfs/proc {{build_dir}}/initramfs/sys {{build_dir}}/initramfs/tmp",
  "cp {{build_dir}}/busybox-armv8l {{build_dir}}/initramfs/bin/busybox",
  "# Use BusyBox itself as the real PID 1 init process. In BusyBox mode we also expose a broad set of applets as direct commands.",
  "if [ '{{option.userspace}}' = 'gnu' ]; then",
  "  cd {{build_dir}}/initramfs/bin && for applet in init cttyhack; do ln -sf busybox $applet; done",
  "else",
  "  cd {{build_dir}}/initramfs/bin && for applet in sh init ls cat echo uname mount mkdir dmesg ps pwd sleep clear true false head tail grep env which cp mv rm ln chmod sync cttyhack awk sed find xargs sort cut tr wc tee df du free kill killall hexdump watch tar gzip gunzip; do ln -sf busybox $applet; done",
  "fi",
  "# /init points at BusyBox, which reads /etc/inittab and starts the serial console shell on ttyAMA0.",
  "ln -sf bin/busybox {{build_dir}}/initramfs/init",
  "# Keep the boot flow readable in the manifest by writing the BusyBox init configuration inline.",
  "# Expand CONSOLE_CMD now so BusyBox init gets a concrete shell command in /etc/inittab.",
  "cat > {{build_dir}}/initramfs/etc/inittab <<EOF",
  "::sysinit:/bin/mount -t proc proc /proc",
  "::sysinit:/bin/mount -t sysfs sysfs /sys",
  "::sysinit:/bin/mount -t devtmpfs devtmpfs /dev",
  "::sysinit:/bin/mkdir -p /dev/pts",
  "ttyAMA0::respawn:$CONSOLE_CMD",
  "::ctrlaltdel:/bin/umount -a -r",
  "::shutdown:/bin/umount -a -r",
  "EOF",
  "chmod +x {{build_dir}}/initramfs/bin/busybox",
  "cd {{build_dir}}/initramfs && find . -print | cpio -o -H newc | gzip -9 > ../initramfs.cpio.gz"
]

[[task]]
name = "busybox-fetch"
print = "[example] Downloading a prebuilt BusyBox userspace for the initramfs"
workdir = "{{root}}"
commands = [
  "mkdir -p {{build_dir}}",
  "sh -c '[ -x {{build_dir}}/busybox-armv8l ] || curl -L --fail https://busybox.net/downloads/binaries/1.31.0-defconfig-multiarch-musl/busybox-armv8l -o {{build_dir}}/busybox-armv8l'",
  "chmod +x {{build_dir}}/busybox-armv8l"
]

[task.host.darwin]
print = "[example] Downloading the prebuilt BusyBox userspace for Darwin hosts"

[[task]]
name = "gnu-userspace-fetch"
print = "[example] Preparing the optional GNU userspace rootfs when userspace=gnu"
workdir = "{{root}}"
commands = [
  [
    "mkdir",
    "-p",
    "{{build_dir}}"
  ],
  [
    "sh",
    "-c",
    "if [ \"{{option.userspace}}\" != \"gnu\" ]; then echo GNU userspace download skipped because userspace={{option.userspace}}.; exit 0; fi"
  ],
  # Use Ubuntu Base because its rootfs tarball extracts cleanly on case-insensitive macOS filesystems.
  [
    "sh",
    "-c",
    "[ -f {{build_dir}}/ubuntu-base-24.04.3-base-arm64.tar.gz ] || curl -L --fail https://cdimage.ubuntu.com/ubuntu-base/releases/noble/release/ubuntu-base-24.04.3-base-arm64.tar.gz -o {{build_dir}}/ubuntu-base-24.04.3-base-arm64.tar.gz"
  ],
]
commands += [
  [
    "rm",
    "-rf",
    "{{build_dir}}/gnu-rootfs"
  ],
  [
    "mkdir",
    "-p",
    "{{build_dir}}/gnu-rootfs"
  ],
  [
    "tar",
    "-xzf",
    "{{build_dir}}/ubuntu-base-24.04.3-base-arm64.tar.gz",
    "-C",
    "{{build_dir}}/gnu-rootfs"
  ]
]

[task.host.darwin]
print = "[example] Preparing the optional GNU userspace rootfs for Darwin hosts"

[[task]]
name = "qemu-run"
print = "[example] Booting the built kernel in QEMU with {{option.userspace}} userspace"
log_output = false
workdir = "{{root}}"
join_on = ["kernel-build", "initramfs"]
shell = [
  "exec qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 1024 -nographic -kernel {{deps_dir}}/linux/arch/arm64/boot/Image -initrd {{build_dir}}/initramfs.cpio.gz -append 'console=ttyAMA0 rdinit=/init'"
]

[[task]]
name = "boot-flow"
workdir = "{{root}}"
parallel = true
next = ["kernel-build", "initramfs", "qemu-run"]
print = "[example] Starting Linux AArch64 build and QEMU boot flow"
commands = [
  "sh -c 'echo Starting Linux AArch64 build and QEMU boot flow'"
]
