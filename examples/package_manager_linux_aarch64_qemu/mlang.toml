[package]
name = "linux_aarch64_qemu"
version = "0.1.0"

[dependencies]
linux = { url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.1.tar.gz", archive = "tar.gz", strip_components = "1", build = "none" }

[c-dependencies]

[tool.mlang]
min_mlang_version = "0.2.0"
make_program = "gmake"
path_entries = [
  "/opt/homebrew/opt/make/libexec/gnubin",
  "/usr/local/opt/make/libexec/gnubin",
  "/opt/homebrew/opt/lld/bin",
  "/usr/local/opt/lld/bin",
  "/opt/homebrew/opt/llvm/bin",
  "/usr/local/opt/llvm/bin",
  "/opt/homebrew/bin",
  "/usr/local/bin"
]

[[task]]
name = "toolchain-check"
workdir = "{{root}}"
commands = [
  "sh -c 'if ! command -v {{make}} >/dev/null 2>&1; then echo Missing required tool in PATH: {{make}}; echo On macOS install Homebrew llvm lld libelf make qemu cpio; exit 1; fi; for tool in /opt/homebrew/opt/llvm/bin/clang /opt/homebrew/opt/llvm/bin/clang++ /opt/homebrew/opt/llvm/bin/llvm-ar /opt/homebrew/opt/llvm/bin/llvm-nm /opt/homebrew/opt/llvm/bin/llvm-objcopy /opt/homebrew/opt/llvm/bin/llvm-ranlib /opt/homebrew/opt/llvm/bin/llvm-strip /opt/homebrew/opt/lld/bin/ld.lld; do if [ ! -x $tool ]; then echo Missing required tool: $tool; echo On macOS install Homebrew llvm lld libelf make qemu cpio; exit 1; fi; done; if [ \"$(uname -s)\" = Darwin ]; then LIBELF_PREFIX=$(brew --prefix libelf 2>/dev/null || true); if [ -z \"$LIBELF_PREFIX\" ] || [ ! -f \"$LIBELF_PREFIX/lib/pkgconfig/libelf.pc\" ]; then echo Missing required Homebrew libelf metadata. Install with: brew install libelf; exit 1; fi; fi'"
]

[[task]]
name = "kernel-defconfig"
workdir = "{{root}}"
env = [
  "LLVM=1",
  "LLVM_IAS=1",
  "HOSTCC=/opt/homebrew/opt/llvm/bin/clang",
  "HOSTCXX=/opt/homebrew/opt/llvm/bin/clang++",
  "CC=/opt/homebrew/opt/llvm/bin/clang",
  "AR=/opt/homebrew/opt/llvm/bin/llvm-ar",
  "NM=/opt/homebrew/opt/llvm/bin/llvm-nm",
  "OBJCOPY=/opt/homebrew/opt/llvm/bin/llvm-objcopy",
  "RANLIB=/opt/homebrew/opt/llvm/bin/llvm-ranlib",
  "STRIP=/opt/homebrew/opt/llvm/bin/llvm-strip"
]
commands = [
  "sh -c 'if [ \"$(uname -s)\" = Darwin ]; then LIBELF_PREFIX=$(brew --prefix libelf 2>/dev/null || true); mkdir -p {{build_dir}}/host-compat; printf \"#include <libelf/sys_elf.h>\\n\" > {{build_dir}}/host-compat/elf.h; export PKG_CONFIG_PATH=\"$LIBELF_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}\"; export HOSTCFLAGS=\"-I{{build_dir}}/host-compat -I$LIBELF_PREFIX/include -I$LIBELF_PREFIX/include/libelf ${HOSTCFLAGS:-}\"; export HOSTLDFLAGS=\"-L$LIBELF_PREFIX/lib ${HOSTLDFLAGS:-}\"; export HOSTLDLIBS=\"-lelf ${HOSTLDLIBS:-}\"; fi; exec {{make}} -C {{deps_dir}}/linux ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE:-} defconfig'"
]

[[task]]
name = "kernel-build"
workdir = "{{root}}"
env = [
  "LLVM=1",
  "LLVM_IAS=1",
  "HOSTCC=/opt/homebrew/opt/llvm/bin/clang",
  "HOSTCXX=/opt/homebrew/opt/llvm/bin/clang++",
  "CC=/opt/homebrew/opt/llvm/bin/clang",
  "AR=/opt/homebrew/opt/llvm/bin/llvm-ar",
  "NM=/opt/homebrew/opt/llvm/bin/llvm-nm",
  "OBJCOPY=/opt/homebrew/opt/llvm/bin/llvm-objcopy",
  "RANLIB=/opt/homebrew/opt/llvm/bin/llvm-ranlib",
  "STRIP=/opt/homebrew/opt/llvm/bin/llvm-strip"
]
commands = [
  "sh -c 'if [ \"$(uname -s)\" = Darwin ]; then LIBELF_PREFIX=$(brew --prefix libelf 2>/dev/null || true); mkdir -p {{build_dir}}/host-compat; printf \"#include <libelf/sys_elf.h>\\n\" > {{build_dir}}/host-compat/elf.h; export PKG_CONFIG_PATH=\"$LIBELF_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}\"; export HOSTCFLAGS=\"-I{{build_dir}}/host-compat -I$LIBELF_PREFIX/include -I$LIBELF_PREFIX/include/libelf ${HOSTCFLAGS:-}\"; export HOSTLDFLAGS=\"-L$LIBELF_PREFIX/lib ${HOSTLDFLAGS:-}\"; export HOSTLDLIBS=\"-lelf ${HOSTLDLIBS:-}\"; fi; exec {{make}} -C {{deps_dir}}/linux ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE:-} defconfig'",
  "sh -c 'if [ \"$(uname -s)\" = Darwin ]; then LIBELF_PREFIX=$(brew --prefix libelf 2>/dev/null || true); mkdir -p {{build_dir}}/host-compat; printf \"#include <libelf/sys_elf.h>\\n\" > {{build_dir}}/host-compat/elf.h; export PKG_CONFIG_PATH=\"$LIBELF_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}\"; export HOSTCFLAGS=\"-I{{build_dir}}/host-compat -I$LIBELF_PREFIX/include -I$LIBELF_PREFIX/include/libelf ${HOSTCFLAGS:-}\"; export HOSTLDFLAGS=\"-L$LIBELF_PREFIX/lib ${HOSTLDFLAGS:-}\"; export HOSTLDLIBS=\"-lelf ${HOSTLDLIBS:-}\"; fi; exec {{make}} -C {{deps_dir}}/linux ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE:-} -j${JOBS:-4} Image'"
]

[[task]]
name = "initramfs"
workdir = "{{root}}"
commands = [
  "rm -rf {{build_dir}}/initramfs {{build_dir}}/initramfs.cpio.gz",
  "mkdir -p {{build_dir}}/initramfs",
  "cp -R {{root}}/rootfs/. {{build_dir}}/initramfs/",
  "chmod +x {{build_dir}}/initramfs/init",
  "sh -c 'cd {{build_dir}}/initramfs && find . -print | cpio -o -H newc | gzip -9 > {{build_dir}}/initramfs.cpio.gz'"
]

[[task]]
name = "qemu-run"
workdir = "{{root}}"
commands = [
  "qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 1024 -nographic -kernel {{deps_dir}}/linux/arch/arm64/boot/Image -initrd {{build_dir}}/initramfs.cpio.gz -append \"console=ttyAMA0 rdinit=/init\""
]
