[package]
name = "mlacker"
version = "0.1.0"
module_paths = ["../modules"]

[dependencies]
vst3sdk = { git = "https://github.com/steinbergmedia/vst3sdk.git", rev = "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96", submodules = true, build = "none", spinner = false }

[tool.mlang]
min_mlang_version = "0.2.0"
build_dir = "build"
deps_dir = "build/deps"

# Install locations; override with `--option bin_dir=...` / `--option plugin_dir=...`.
[tool.mlang.options]
bin_dir = "~/.local/bin"
plugin_dir = "~/.local/mlaplugins"
plugins = "mla_verb mla_distortion mla_delay mla_eq mla_filter mla_drum"

[[task]]
name = "prepare"
workdir = "{{root}}"
supported_hosts = ["darwin"]
unsupported_message = "mlacker currently uses macOS AUHAL audio output"
commands = ["mkdir -p {{build_dir}}/obj", "cmake --build ../build --target mlang_std -j4"]

[[task]]
name = "compile-main"
phase = "compile"
workdir = "{{root}}"
depends_on = ["prepare"]
language = "mlang"
source = "src/main.mla"
output = "{{build_dir}}/obj/main.o"
compile_only = true
opt_level = "O2"
compiler_flags = ["-Wno-unwrap", "-Wno-colon-if"]

[[task]]
name = "configure"
workdir = "{{root}}"
depends_on = ["compile-main"]
commands = ["cmake -S {{root}} -B {{build_dir}}/cmake -DCMAKE_BUILD_TYPE=Release -DVST3_SDK_ROOT={{deps_dir}}/vst3sdk -DMLACKER_MAIN_OBJECT={{build_dir}}/obj/main.o"]

[[task]]
name = "build"
phase = "build"
workdir = "{{root}}"
depends_on = ["configure"]
commands = ["cmake --build {{build_dir}}/cmake -j4"]

[[task]]
name = "run"
workdir = "{{root}}"
depends_on = ["build"]
log_output = false
shell = ["exec {{build_dir}}/cmake/bin/mlacker"]

[[task]]
name = "test"
workdir = "{{root}}"
depends_on = ["build"]
commands = ["ctest --test-dir {{build_dir}}/cmake --output-on-failure"]

[[task]]
name = "install"
print = "[mlacker] Installing mlacker to {{option.bin_dir}}"
workdir = "{{root}}"
depends_on = ["build"]
shell = [
  "set -e",
  "bin_dir={{option.bin_dir}}",
  "mkdir -p \"$bin_dir\"",
  "cp -f {{build_dir}}/cmake/bin/mlacker \"$bin_dir/mlacker\"",
  "chmod +x \"$bin_dir/mlacker\"",
  "codesign --force --sign - \"$bin_dir/mlacker\"",
  "echo \"Installed $bin_dir/mlacker\""
]

[[task]]
name = "build-plugins"
print = "[mlacker] Building the Mla VST3 plugins"
workdir = "{{root}}/.."
depends_on = ["prepare"]
shell = [
  "set -e",
  "for plugin in {{option.plugins}}; do build/mlang pkg --config plugins/$plugin/mlang.toml build; done"
]

[[task]]
name = "install-plugins"
print = "[mlacker] Installing the Mla VST3 plugins to {{option.plugin_dir}}"
workdir = "{{root}}/.."
depends_on = ["build-plugins"]
shell = [
  "set -e",
  "plugin_dir={{option.plugin_dir}}",
  "mkdir -p \"$plugin_dir\"",
  "for plugin in {{option.plugins}}; do for bundle in plugins/$plugin/build/cmake/VST3/Release/*.vst3; do dest=\"$plugin_dir/$(basename \"$bundle\")\"; rm -rf \"$dest\"; cp -R \"$bundle\" \"$dest\"; codesign --force --sign - \"$dest\"; echo \"Installed $dest\"; done; done"
]

[[task]]
name = "install-all"
print = "[mlacker] Installed mlacker and the Mla VST3 plugins"
workdir = "{{root}}"
depends_on = ["install", "install-plugins"]
commands = ["echo mlacker install-all completed"]
