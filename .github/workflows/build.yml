name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      CC: clang-17
      CXX: clang++-17

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-17 llvm-17-dev clang-17 lld-17 flex bison \
            libssl-dev libzstd-dev libz3-dev zlib1g-dev \
            rapidjson-dev ninja-build python3

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DMLANG_VERSION_BUILD=${BUILD_NUMBER} \
            -DBUILD_TESTS=ON \
            -DMLANGD_BUILD_FORMATTER_DEPENDENCY=OFF

      - name: Build compiler, runtime, and tools
        run: |
          cmake --build build --target mlang mlang_std mlang-config mlangd-mla mlang_format mla_tests --parallel 2

      - name: Build self-hosted tools
        run: |
          build/mlang tools/mlang-frontend-mla/main.mla --no-tests -Wno-unwrap -O0 -L build -lmlang_std -o build/mlang-frontend-mla
          cat > build/mlang-frontend <<'EOF'
          #!/usr/bin/env sh
          set -eu
          bin_dir="$(cd "$(dirname "$0")" && pwd)"
          exec "$bin_dir/mlang-frontend-mla" --backend "$bin_dir/mlang" "$@"
          EOF
          chmod +x build/mlang-frontend
          build/mlang tools/mlangpkg/mlangpkg.mla --no-tests -Wno-unwrap -O0 -L build -lmlang_std -o build/mlangpkg

      - name: Stage compiled binaries
        run: |
          mkdir -p dist/bin dist/lib
          cp -f build/mlang dist/bin/
          cp -f build/mlang-config dist/bin/
          cp -f build/mlangd-mla dist/bin/
          cp -f build/mlang-format dist/bin/
          cp -f build/mlang-frontend-mla dist/bin/
          cp -f build/mlang-frontend dist/bin/
          cp -f build/mlangpkg dist/bin/
          cp -f build/libmlang_std.a dist/lib/
          chmod +x dist/bin/*
          echo "=== Staged binaries in dist/bin ==="
          ls -la dist/bin
          echo "=== Staged libraries in dist/lib ==="
          ls -la dist/lib

      - name: Package build tree for test job
        run: |
          tar -czf build-cache.tar.gz build

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: mlang-binaries-linux
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload build tree for testing
        uses: actions/upload-artifact@v4
        with:
          name: mlang-build-tree
          path: build-cache.tar.gz
          if-no-files-found: error
          retention-days: 1

  test:
    name: Run tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: clang-17
      CXX: clang++-17

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-17 llvm-17-dev clang-17 lld-17 flex bison \
            libssl-dev libzstd-dev libz3-dev zlib1g-dev \
            rapidjson-dev python3 python3-venv

      - name: Install Python test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r tests/requirements.txt

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: mlang-build-tree

      - name: Extract build tree
        run: |
          tar -xzf build-cache.tar.gz
          chmod +x build/mlang build/mlang-config build/mlangd-mla build/mlang-format build/mlang-frontend-mla build/mlang-frontend build/mlangpkg 2>/dev/null || true
          if [ -f build/tests/mla_tests ]; then
            chmod +x build/tests/mla_tests
          fi

      - name: Unit tests
        run: |
          mkdir -p artifacts/unit
          ctest --test-dir build \
            --output-on-failure \
            --output-junit "$PWD/artifacts/unit/ctest.xml"

      - name: Robot tests
        env:
          MLANG_BIN: ${{ github.workspace }}/build/mlang
          MLANG_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/robot/mlang
          ROBOT_RESULTS_DIR: ${{ github.workspace }}/artifacts/robot
          ROBOT_JOBS: 2
          ROBOT_ALLOW_FLAKY_PASS: 0
          ROBOT_COLOR_LOGS: never
        run: ./tests/run_examples_robot.sh

      - name: LSP integration transcript
        run: |
          python3 tests/lsp_integration_transcript.py --mlangd build/mlangd-mla

      - name: LSP parity E2E
        run: |
          python3 tests/lsp_parity_e2e.py --mlangd build/mlangd-mla --bulk-files 180

      - name: Formatter E2E
        run: |
          python3 tests/mlang_format_spacing_e2e.py --mlang-format build/mlang-format

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: artifacts
          if-no-files-found: ignore
          retention-days: 14
