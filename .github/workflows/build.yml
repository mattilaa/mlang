name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev clang-17 lld-17 flex bison
      - name: Configure
        run: |
          cmake -S . -B build \
            -DMLANG_VERSION_BUILD=${BUILD_NUMBER} \
            -DMLANGD_BUILD_FORMATTER_DEPENDENCY=OFF
      - name: Build
        run: |
          cmake --build build --target mlang mlangd mlang_std
      - name: LSP integration transcript
        run: |
          python3 tests/lsp_integration_transcript.py --mlangd build/mlangd
      - name: LSP parity E2E
        run: |
          python3 tests/lsp_parity_e2e.py --mlangd build/mlangd --bulk-files 180
