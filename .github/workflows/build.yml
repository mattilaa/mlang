name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      CC: clang-17
      CXX: clang++-17
      LLVM_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-17
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev clang-17 lld-17 flex bison
      - name: Configure
        run: |
          cmake -S . -B build \
            -DMLANG_VERSION_BUILD=${BUILD_NUMBER}
      - name: Build
        run: |
          # mlangd-mla already depends on both mlang and mlang_std.
          cmake --build build --target mlangd-mla
      - name: LSP integration transcript
        run: |
          python3 tests/lsp_integration_transcript.py --mlangd build/mlangd-mla
      - name: LSP parity E2E
        run: |
          python3 tests/lsp_parity_e2e.py --mlangd build/mlangd-mla --bulk-files 180
      - name: LSP formatting configuration
        run: |
          python3 tests/lsp_mlangd_format_config_transcript.py --mlangd build/mlangd-mla
