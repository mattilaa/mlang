name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev clang-17 lld-17 flex bison
      - name: Configure
        run: |
          cmake -S . -B build -DMLANG_VERSION_BUILD=${BUILD_NUMBER}
      - name: Build
        run: |
          cmake --build build --target mlang mlang-lsp
