[package]
name = "mla_drum"
version = "0.1.0"
module_paths = ["../../modules"]

[dependencies]
vst3sdk = { git = "https://github.com/steinbergmedia/vst3sdk.git", rev = "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96", submodules = true, build = "none", spinner = false }

[tool.mlang]
min_mlang_version = "0.2.0"
build_dir = "build"
deps_dir = "build/deps"

# The MLang runtime archive the plug-in links against. Built from the repo root.
[[task]]
name = "prepare"
print = "[mla_drum] Preparing build tree and MLang runtime archive"
workdir = "{{root}}"
commands = [
  "mkdir -p {{build_dir}}/obj {{build_dir}}/cmake",
  "cmake --build ../../build --target mlang_std -j4"
]

[[task]]
name = "compile-dsp"
phase = "compile"
print = "[mla_drum] Compiling the MLang drum voice DSP object"
workdir = "{{root}}"
depends_on = ["prepare"]
language = "mlang"
source = "src/mla_drum_dsp.mla"
output = "{{build_dir}}/obj/mla_drum_dsp.o"
compile_only = true
opt_level = "O2"

[[task]]
name = "configure"
print = "[mla_drum] Configuring the CMake project for the VST3 instrument bundle"
workdir = "{{root}}"
depends_on = ["compile-dsp"]
commands = [
  "cmake -S {{root}} -B {{build_dir}}/cmake -DCMAKE_BUILD_TYPE=Release -DVST3_SDK_ROOT={{deps_dir}}/vst3sdk -DMLANG_DSP_OBJECT={{build_dir}}/obj/mla_drum_dsp.o -DMLANG_STD_LIBRARY=../../build/libmlang_std.a"
]

[[task]]
name = "build"
phase = "build"
print = "[mla_drum] Building the Mla Drum .vst3 bundle"
workdir = "{{root}}"
depends_on = ["configure"]
commands = [
  "cmake --build {{build_dir}}/cmake --target MlaDrum -j4"
]

[[task]]
name = "test"
print = "[mla_drum] Running the offline functional tests against the built bundle"
workdir = "{{root}}"
depends_on = ["build"]
commands = [
  "cmake --build {{build_dir}}/cmake --target mla_drum_tests -j4",
  "sh -c 'mkdir -p {{build_dir}}/test && exec {{build_dir}}/cmake/bin/Release/mla_drum_tests {{build_dir}}/cmake/VST3/Release/MlaDrum.vst3 {{build_dir}}/test'"
]
